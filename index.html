    <script>
      (function () {
        // Site opens in light mode by default. It only switches to dark
        // if the visitor has explicitly picked dark before (saved in
        // localStorage) — that choice is what the ThemeToggle writes.
        try {
          var saved = localStorage.getItem('theme')
          document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
